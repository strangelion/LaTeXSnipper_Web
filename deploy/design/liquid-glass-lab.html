<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Liquid Glass Engine V2 Lab</title>
  <link rel="stylesheet" href="/styles/site-tokens.css">
  <link rel="stylesheet" href="/styles/liquid-glass.css">
  <link rel="stylesheet" href="/styles/liquid-glass-lab.css">
  <script src="/js/product-shell.js" defer></script>
</head>
<body>
  <main class="lab-shell">
    <header class="lab-heading">
      <div><p>DEVELOPMENT MATERIAL LAB</p><h1>Liquid Glass Engine V2</h1></div>
      <aside class="engine-readout" aria-live="polite"><strong>Current Engine</strong><code id="engineName">检测中</code><span id="engineDetails"></span></aside>
    </header>

    <section class="lab-controls standard-surface" aria-label="材质调试开关">
      <label><input type="checkbox" data-debug-toggle="blur" checked> Blur</label>
      <label><input type="checkbox" data-debug-toggle="refraction" checked> Refraction</label>
      <label><input type="checkbox" data-debug-toggle="optics" checked> Optics</label>
      <label><input type="checkbox" data-debug-toggle="tint" checked> Tint</label>
    </section>

    <section class="lab-scene" aria-label="深色材质测试场景">
      <div class="scene-grid" aria-hidden="true"></div><div class="scene-orb orb-a" aria-hidden="true"></div><div class="scene-orb orb-b" aria-hidden="true"></div>
      <div class="scene-word" aria-hidden="true">TRANSMISSION</div>
      <img class="scene-image" src="/assets/images/product/hero-workspace.webp" alt="用于检查玻璃透射与折射的工作台截图">
      <div class="scene-line line-a" aria-hidden="true"></div><div class="scene-line line-b" aria-hidden="true"></div>

      <div class="material-stack">
        <div class="lab-navigation lg-surface lg-surface--navigation" data-lg-interactive="true"><span class="lg-backdrop" aria-hidden="true"></span><span class="lg-optics" aria-hidden="true"><span class="lg-caustic"></span><span class="lg-specular"></span><span class="lg-rim"></span></span><div class="lg-content"><strong>Navigation · Regular</strong><span>7px stabilization</span></div></div>
        <div class="lab-row">
          <button class="lab-control lg-surface lg-surface--clear" data-lg-interactive="true"><span class="lg-backdrop" aria-hidden="true"></span><span class="lg-optics" aria-hidden="true"><span class="lg-caustic"></span><span class="lg-specular"></span><span class="lg-rim"></span></span><span class="lg-content">Clear Control</span></button>
          <button class="lab-control lg-surface lg-surface--control" data-lg-interactive="true"><span class="lg-backdrop" aria-hidden="true"></span><span class="lg-optics" aria-hidden="true"><span class="lg-caustic"></span><span class="lg-specular"></span><span class="lg-rim"></span></span><span class="lg-content">Regular Control</span></button>
          <div class="lab-floating lg-surface lg-surface--floating" data-lg-interactive="true"><span class="lg-backdrop" aria-hidden="true"></span><span class="lg-optics" aria-hidden="true"><span class="lg-caustic"></span><span class="lg-specular"></span><span class="lg-rim"></span></span><div class="lg-content"><strong>Floating</strong><span>High transmission</span></div></div>
        </div>
        <div class="lab-panel lg-surface lg-surface--panel"><span class="lg-backdrop" aria-hidden="true"></span><span class="lg-optics" aria-hidden="true"><span class="lg-caustic"></span><span class="lg-specular"></span><span class="lg-rim"></span></span><div class="lg-content"><strong>Text-heavy Panel</strong><p>关闭 Blur 后，背景网格、细线与大字仍应通过 rim、specular、caustic 和高透射材质保持清晰的表面定义。</p></div></div>
      </div>
    </section>
  </main>
  <script>
    addEventListener('DOMContentLoaded', function () {
      var root = document.documentElement;
      var name = document.getElementById('engineName');
      var details = document.getElementById('engineDetails');
      function refresh() {
        name.textContent = (root.dataset.liquidEngine || 'optical-fallback').toUpperCase().replaceAll('-', '_');
        details.textContent = 'Backdrop filter: ' + (root.dataset.lgBackdropSupported || 'false') + ' · SVG backdrop reference: ' + (root.dataset.lgSvgReferenceEnabled || 'false') + ' · Reduced motion: ' + matchMedia('(prefers-reduced-motion: reduce)').matches;
      }
      document.querySelectorAll('[data-debug-toggle]').forEach(function (input) {
        input.addEventListener('change', function () {
          var key = input.dataset.debugToggle;
          var attr = key === 'blur' ? 'data-lg-blur' : key === 'refraction' ? 'data-lg-refraction' : key === 'optics' ? 'data-lg-optics' : 'data-lg-tint';
          if (input.checked) root.removeAttribute(attr); else root.setAttribute(attr, 'off');
          if (key === 'blur') { if (input.checked) root.removeAttribute('data-liquid-debug'); else root.setAttribute('data-liquid-debug', 'no-blur'); }
        });
      });
      setTimeout(refresh, 0);
    });
  </script>
</body>
</html>
