<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 150" role="img" aria-labelledby="title desc">
  <title id="title">Gaussian integral</title>
  <desc id="desc">The integral from zero to infinity of e to the negative x squared, with respect to x, equals square root of pi over two.</desc>
  <g fill="currentColor" font-family="STIX Two Math, Cambria Math, Latin Modern Math, Times New Roman, serif">
    <text x="28" y="108" font-size="88">∫</text>
    <text x="83" y="44" font-size="27">∞</text>
    <text x="85" y="125" font-size="27">0</text>
    <text x="118" y="101" font-size="66" font-style="italic">e</text>
    <text x="161" y="58" font-size="30">−x²</text>
    <text x="231" y="101" font-size="64" font-style="italic">dx</text>
    <text x="328" y="100" font-size="60">=</text>
    <path d="M399 76h13l10 20 16-52h76" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="452" y="91" font-size="55">π</text>
    <path d="M398 105h128" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
    <text x="451" y="140" font-size="37">2</text>
  </g>
</svg>
