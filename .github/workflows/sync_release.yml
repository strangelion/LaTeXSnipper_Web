name: 同步 Release 到 R2

on:
  schedule:
    - cron: '7 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: latexsnipper-web-master-writer
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      should_sync: ${{ steps.decide.outputs.should_sync }}
      changed_assets: ${{ steps.decide.outputs.changed_assets }}
      asset_timestamps: ${{ steps.decide.outputs.asset_timestamps }}
      should_build_manual: ${{ steps.check_manual.outputs.manual_updated }}
    steps:
      - uses: actions/checkout@v6

      - name: 检查各 Release 文件时间戳
        id: decide
        env:
          GH_TOKEN: ${{ secrets.PAT_GITHUB }}
        run: |
          python3 << 'PYEOF'
          import json, os, subprocess

          with open("public/release-manifest.json", encoding="utf-8") as f:
              manifest = json.load(f)
          ASSETS = [item["href"].removeprefix("/dl/") for item in manifest["assets"]]
          release_tag = manifest["releaseNotesUrl"].rstrip("/").rsplit("/", 1)[-1]

          # Fetch release assets information
          # Step 1: get release_id from tag endpoint
          tag_url = f"https://api.github.com/repos/SakuraMathcraft/LaTeXSnipper/releases/tags/{release_tag}"
          result = subprocess.run(
              ["curl", "-sL", "--retry", "2",
               "-H", "Accept: application/vnd.github+json",
               "-H", f"Authorization: Bearer {os.environ['GH_TOKEN']}",
               tag_url],
              capture_output=True, text=True
          )
          release = json.loads(result.stdout)
          release_id = release.get("id")
          if not release_id:
              print("ERROR: could not get release_id from tag endpoint")
              print(json.dumps(release, indent=2)[:500])
              raise SystemExit(1)

          # Step 2: fetch all assets via the dedicated endpoint (supports pagination)
          assets_url = f"https://api.github.com/repos/SakuraMathcraft/LaTeXSnipper/releases/{release_id}/assets?per_page=100"
          result = subprocess.run(
              ["curl", "-sL", "--retry", "2",
               "-H", "Accept: application/vnd.github+json",
               "-H", f"Authorization: Bearer {os.environ['GH_TOKEN']}",
               assets_url],
              capture_output=True, text=True
          )
          all_assets = json.loads(result.stdout)
          # Validate we got a list (not a dict with error message)
          if isinstance(all_assets, dict):
              print("WARNING: assets endpoint returned an object instead of list:", json.dumps(all_assets)[:200])
              all_assets = release.get("assets", [])
          api_assets = {a["name"]: a["updated_at"] for a in all_assets if a.get("name") in ASSETS}
          print("Fetched all_assets count:", len(all_assets) if isinstance(all_assets, list) else "N/A")
          print("API asset timestamps:", json.dumps(api_assets, indent=2))

          # Read stored state (single file, merged with manual state)
          state = {}
          if os.path.exists(".release_state.json"):
              with open(".release_state.json") as f:
                  state = json.load(f)

          stored = state.get("assets", {})
          is_manual = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"

          # Determine changed assets by comparing timestamps per-file
          changed = []
          for name in ASSETS:
              api_ts = api_assets.get(name)
              if not api_ts or api_ts == "null":
                  print(f"  {name}: no timestamp in API, skip")
                  continue
              stored_ts = stored.get(name)
              if is_manual or api_ts != stored_ts:
                  print(f"  {name}: changed  {stored_ts or '(none)'}  ->  {api_ts}")
                  changed.append(name)
              else:
                  print(f"  {name}: unchanged  ({api_ts})")

          if is_manual:
              # A manually-dispatched sync validates every declared asset. This
              # also handles a maintainer replacing files under the same tag.
              changed = ASSETS
          should_sync = "true" if changed else "false"

          # Write outputs for subsequent jobs
          github_output = os.environ.get("GITHUB_OUTPUT")
          if github_output:
              with open(github_output, "a") as f:
                  f.write(f"should_sync={should_sync}\n")
                  f.write(f"changed_assets={json.dumps(changed)}\n")
                  f.write(f"asset_timestamps={json.dumps(api_assets)}\n")

          print(f"should_sync={should_sync}")
          print(f"changed_assets={json.dumps(changed)}")
          PYEOF

      - name: 检查上游用户手册是否更新（仅检测，不写入；由 build-manual 构建成功后写入）
        id: check_manual
        if: github.event_name == 'schedule'
        run: |
          UPSTREAM_SHA=$(curl -sL -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PAT_GITHUB }}" \
            "https://api.github.com/repos/SakuraMathcraft/LaTeXSnipper/contents/user_manual/user_manual.typ" \
            | jq -r '.sha')
          echo "Upstream SHA: $UPSTREAM_SHA"

          MANUAL_UPDATED=false
          if [ -f .release_state.json ]; then
              LAST_SHA=$(jq -r '.last_manual_sha // empty' .release_state.json)
              if [ "$UPSTREAM_SHA" != "$LAST_SHA" ] && [ "$UPSTREAM_SHA" != "null" ] && [ -n "$UPSTREAM_SHA" ]; then
                  MANUAL_UPDATED=true
                  echo "Manual updated: $LAST_SHA -> $UPSTREAM_SHA"
              else
                  echo "Manual unchanged"
              fi
          fi
          echo "manual_updated=$MANUAL_UPDATED" >> $GITHUB_OUTPUT

  sync:
    needs: check
    if: needs.check.outputs.should_sync == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - name: 下载并上传变更文件到 R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CHANGED: ${{ needs.check.outputs.changed_assets }}
          ASSET_TIMESTAMPS: ${{ needs.check.outputs.asset_timestamps }}
        run: |
          python3 << PYEOF
          import json, os, subprocess, hashlib, sys

          changed = json.loads(os.environ.get('CHANGED', '[]'))
          if not changed:
              print('No changed files to sync, exiting')
              sys.exit(0)

          with open('public/release-manifest.json', encoding='utf-8') as f:
              manifest = json.load(f)
          release_tag = manifest['releaseNotesUrl'].rstrip('/').rsplit('/', 1)[-1]
          assets_by_name = {
              item['href'].removeprefix('/dl/'): item
              for item in manifest['assets']
          }

          def human_size(size_bytes):
              value = float(size_bytes)
              for unit in ["B", "KB", "MB", "GB"]:
                  if value < 1024 or unit == "GB":
                      return f"{value:.1f} {unit}"
                  value /= 1024

          os.makedirs('.sync_tmp', exist_ok=True)
          for name in changed:
              item = assets_by_name.get(name)
              if item is None:
                  raise SystemExit(f'Asset is not declared by the release manifest: {name}')
              url = f'https://github.com/SakuraMathcraft/LaTeXSnipper/releases/download/{release_tag}/{name}'
              out = f'.sync_tmp/{name}'
              print(f'Downloading {name}...')
              subprocess.run(['curl', '-sL', '--retry', '2', url, '-o', out], check=True)
              sha = hashlib.sha256(open(out, 'rb').read()).hexdigest()
              size_bytes = os.path.getsize(out)
              print(f'  SHA256: {sha}')

              item['sha256'] = sha
              item['size'] = human_size(size_bytes)

              subprocess.run(['npx', 'wrangler', 'r2', 'object', 'delete', f'release/{name}', '--remote'],
                          capture_output=True, timeout=60000)
              subprocess.run(['npx', 'wrangler', 'r2', 'object', 'put', f'release/{name}', '--file', out, '--remote'],
                          check=True, timeout=120000)
              print(f'  Uploaded release/{name}')
          # Do not publish a partially-updated manifest: this file is written
          # only after every changed asset has downloaded, verified, and uploaded.
          with open('/tmp/release-manifest.json', 'w', encoding='utf-8') as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
              f.write('\n')
          desktop_downloads = {}
          for item in manifest['assets']:
              if item['platform'] in ('windows', 'linux', 'macos') and item['platform'] not in desktop_downloads:
                  desktop_downloads[item['platform']] = item
          legacy = {key: manifest[key] for key in ('version', 'channel', 'publishedAt', 'releaseNotesUrl')}
          legacy['downloads'] = desktop_downloads
          with open('/tmp/release.json', 'w', encoding='utf-8') as f:
              json.dump(legacy, f, ensure_ascii=False, indent=2)
              f.write('\n')

          subprocess.run(['rm', '-rf', '.sync_tmp'])
          PYEOF

      - name: 原子更新发布 manifest
        env:
          ASSET_TIMESTAMPS: ${{ needs.check.outputs.asset_timestamps }}
        run: |
          if [ -f /tmp/release-manifest.json ] && [ -f /tmp/release.json ]; then
            cp /tmp/release-manifest.json public/release-manifest.json
            cp /tmp/release.json public/release.json
            node scripts/validate-release-manifest.mjs public/release-manifest.json
            python3 - << 'PYEOF'
          import json, os
          with open('.release_state.json', encoding='utf-8') as f:
              state = json.load(f)
          timestamps = json.loads(os.environ.get('ASSET_TIMESTAMPS', '{}'))
          stored = state.setdefault('assets', {})
          stored.update({name: value for name, value in timestamps.items() if value})
          values = [value for value in stored.values() if value]
          state['last_sync'] = max(values) if values else ''
          with open('.release_state.json', 'w', encoding='utf-8') as f:
              json.dump(state, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PYEOF
            echo "Release manifest updated"
          else
            echo "No release manifest generated, skipping"
            exit 1
          fi

      - name: 提交发布 manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/release-manifest.json public/release.json .release_state.json
          git diff --staged --quiet && echo "No manifest changes" || (
            git commit -m "chore: sync release manifest" &&
            for i in 1 2 3; do
              if git pull --rebase && git push; then
                echo "Push succeeded on attempt $i"
                break
              fi
              echo "Push failed on attempt $i, retrying..."
              sleep 2
            done
          )

  build-manual:
    needs: check
    if: needs.check.outputs.should_build_manual == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 触发用户手册构建
        run: |
          curl -sL -X POST \
            -H "Authorization: Bearer ${{ secrets.PAT_GITHUB }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-manual.yml/dispatches" \
            -d '{"ref":"master"}'
          echo "Triggered build-manual workflow"
