name: 同步 Release 到 R2

on:
  schedule:
    - cron: '7 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: latexsnipper-web-master-writer
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      should_sync: ${{ steps.decide.outputs.should_sync }}
      changed_assets: ${{ steps.decide.outputs.changed_assets }}
      asset_timestamps: ${{ steps.decide.outputs.asset_timestamps }}
      resolved_release: ${{ steps.decide.outputs.resolved_release }}
      should_build_manual: ${{ steps.check_manual.outputs.manual_updated }}
    steps:
      - uses: actions/checkout@v6

      - name: 自动解析最新完整稳定版 Release
        id: decide
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/resolve-upstream-release.py

      - name: 检查上游用户手册是否更新
        id: check_manual
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_SHA=$(curl -fsSL --retry 2 \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/SakuraMathcraft/LaTeXSnipper/contents/user_manual/user_manual.typ" \
            | jq -r '.sha // empty')

          echo "Upstream SHA: $UPSTREAM_SHA"
          if [[ -z "$UPSTREAM_SHA" ]]; then
            echo "Unable to resolve upstream manual SHA" >&2
            exit 1
          fi

          LAST_SHA=""
          if [[ -f .release_state.json ]]; then
            LAST_SHA=$(jq -r '.last_manual_sha // empty' .release_state.json)
          fi

          if [[ "$UPSTREAM_SHA" != "$LAST_SHA" ]]; then
            echo "Manual updated: ${LAST_SHA:-'(none)'} -> $UPSTREAM_SHA"
            echo "manual_updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "Manual unchanged"
            echo "manual_updated=false" >> "$GITHUB_OUTPUT"
          fi

  sync:
    needs: check
    if: needs.check.outputs.should_sync == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci --ignore-scripts

      - name: 解析 R2 S3 端点和凭证
        id: r2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          account="$R2_ACCOUNT_ID"
          if [[ -z "$account" ]]; then
            account=$(curl -fsSL --retry 2 \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              https://api.cloudflare.com/client/v4/accounts \
              | jq -r '.result[0].id // empty')
          fi
          if [[ -z "$account" ]]; then
            echo "Unable to resolve the R2 account id" >&2
            exit 1
          fi
          endpoint="https://${account}.r2.cloudflarestorage.com"
          echo "endpoint=${endpoint}" >> "$GITHUB_OUTPUT"
          # Fail here, not halfway through a multi-GB upload.
          aws --version

      - name: 下载并上传变更文件到 R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ENDPOINT: ${{ steps.r2.outputs.endpoint }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # AWS CLI v2 defaults to CRC32 request checksums, which R2 rejects.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          AWS_RETRY_MODE: standard
          AWS_MAX_ATTEMPTS: '5'
          CHANGED: ${{ needs.check.outputs.changed_assets }}
          RESOLVED_RELEASE: ${{ needs.check.outputs.resolved_release }}
        run: |
          python3 << 'PYEOF'
          import hashlib
          import json
          import os
          import pathlib
          import shutil
          import subprocess

          changed = set(json.loads(os.environ.get("CHANGED", "[]")))
          resolved = json.loads(os.environ["RESOLVED_RELEASE"])

          with open("public/release-manifest.json", encoding="utf-8") as f:
              current = json.load(f)
          existing = {
              item.get("id"): item for item in current.get("assets", [])
          }

          def human_size(size_bytes):
              value = float(size_bytes)
              for unit in ("B", "KB", "MB", "GB"):
                  if value < 1024 or unit == "GB":
                      return f"{value:.1f} {unit}"
                  value /= 1024

          tmp = pathlib.Path(".sync_tmp")
          shutil.rmtree(tmp, ignore_errors=True)
          tmp.mkdir(parents=True)
          new_assets = []

          def stream_sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          # 3.2 renamed every desktop package to <platform>_<arch>_<edition>.
          # Older manifests use the pre-3.2 ids, so reuse their metadata.
          legacy_ids = {
              "windows-x86_64-cpu": "windows-x86_64",
              "linux-amd64-cpu": "linux-amd64",
              "macos-arm64-cpu": "macos-arm64",
          }
          wrangler = ["npx", "--no-install", "wrangler"]
          bucket = os.environ.get("R2_RELEASE_BUCKET") or "release"
          endpoint = os.environ["R2_ENDPOINT"]

          def r2(*args, timeout=600):
              # The S3 API streams multipart uploads, so multi-GB GPU builds no
              # longer run into the wrangler upload limit.
              return subprocess.run(
                  [
                      "aws", "s3", *args,
                      "--endpoint-url", endpoint,
                      "--only-show-errors",
                  ],
                  check=False,
                  timeout=timeout,
              )

          for asset in resolved["assets"]:
              name = asset["name"]
              asset_id = asset["id"]
              old = existing.get(asset_id)
              if old is None:
                  old = existing.get(legacy_ids.get(asset_id, ""), {})
              # Only a byte-identical file may reuse the recorded metadata. A
              # renamed asset belongs to a new build, so inheriting the old
              # checksum would reject a perfectly valid download.
              if old.get("href") != f"/dl/{name}":
                  old = {}
              # desktop-release.json publishes the official checksum and size.
              sha256 = asset.get("sha256") or old.get("sha256", "")
              if asset.get("size"):
                  size = human_size(asset["size"])
              else:
                  size = old.get("size", "")

              if name in changed:
                  out = tmp / name
                  print(f"Downloading {name} from {asset['url']}...")
                  subprocess.run(
                      [
                          "curl", "-fL", "--retry", "2",
                          "--retry-all-errors", asset["url"], "-o", str(out),
                      ],
                      check=True,
                  )
                  if not out.is_file() or out.stat().st_size == 0:
                      raise SystemExit(f"Downloaded asset is empty: {name}")

                  actual = stream_sha256(out)
                  if sha256 and actual != sha256:
                      raise SystemExit(
                          f"Checksum mismatch for {name}: upstream says "
                          f"{sha256}, download is {actual}"
                      )
                  sha256 = actual
                  size = human_size(out.stat().st_size)
                  print(f"  SHA256: {sha256}")
                  print(f"  Size: {size}")

                  deleted = r2("rm", f"s3://{bucket}/{name}", timeout=120)
                  if deleted.returncode != 0:
                      print(f"  Skipped delete for release/{name}")
                  # GPU packages are 1.5-2 GB, beyond the old 180s budget.
                  uploaded = r2(
                      "cp", str(out), f"s3://{bucket}/{name}", timeout=3600
                  )
                  if uploaded.returncode != 0:
                      raise SystemExit(f"R2 upload failed for {name}")
                  print(f"  Uploaded release/{name}")
                  out.unlink(missing_ok=True)

              if not sha256 or not size:
                  raise SystemExit(f"No integrity metadata for asset: {name}")

              entry = {
                  "id": asset_id,
                  "platform": asset["platform"],
                  "label": asset["label"],
                  "architecture": asset["architecture"],
                  "requirements": asset["requirements"],
                  "href": f"/dl/{name}",
                  "sha256": sha256,
                  "size": size,
              }
              if asset.get("edition"):
                  entry["edition"] = asset["edition"]
              new_assets.append(entry)

          # R2 mirrors the live release only. Archived entries link to GitHub,
          # so pruning /dl/ objects can never break an old download page.
          state_path = pathlib.Path(".release_state.json")
          previous = {}
          if state_path.exists():
              previous = json.loads(state_path.read_text(encoding="utf-8"))
          keep = {asset["name"] for asset in resolved["assets"]}
          stale = [
              name for name in (previous.get("assets") or {})
              if name not in keep
          ]
          for name in stale:
              print(f"Pruning release/{name} from R2")
              pruned = r2("rm", f"s3://{bucket}/{name}", timeout=120)
              if pruned.returncode != 0:
                  print(f"  Skipped pruning release/{name}")

          default_schema = "/schemas/release-manifest-v1.schema.json"
          manifest = {
              "$schema": current.get("$schema", default_schema),
              "schemaVersion": current.get("schemaVersion", 1),
              "product": current.get("product", "LaTeXSnipper Desktop"),
              "version": resolved["version"],
              "channel": resolved["channel"],
              "publishedAt": resolved["publishedAt"],
              "releaseNotesUrl": resolved["releaseNotesUrl"],
              "assets": new_assets,
          }

          with open("/tmp/release-manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
              f.write("\n")

          desktop_downloads = {}
          for item in new_assets:
              if item["platform"] not in ("windows", "linux", "macos"):
                  continue
              current_item = desktop_downloads.get(item["platform"])
              # The legacy single-link contract stays on the CPU edition.
              if current_item is None or (
                  item.get("edition") == "cpu"
                  and current_item.get("edition") != "cpu"
              ):
                  desktop_downloads[item["platform"]] = item
          legacy = {
              "version": manifest["version"],
              "channel": manifest["channel"],
              "publishedAt": manifest["publishedAt"],
              "releaseNotesUrl": manifest["releaseNotesUrl"],
              "downloads": desktop_downloads,
          }
          with open("/tmp/release.json", "w", encoding="utf-8") as f:
              json.dump(legacy, f, ensure_ascii=False, indent=2)
              f.write("\n")

          shutil.rmtree(tmp, ignore_errors=True)
          PYEOF

      - name: 原子更新发布 manifest
        env:
          ASSET_TIMESTAMPS: ${{ needs.check.outputs.asset_timestamps }}
        run: |
          set -euo pipefail
          test -f /tmp/release-manifest.json
          test -f /tmp/release.json
          # Archive the outgoing release while the live manifest is current.
          node scripts/record-archived-release.mjs /tmp/release-manifest.json
          cp /tmp/release-manifest.json public/release-manifest.json
          cp /tmp/release.json public/release.json
          node scripts/validate-release-manifest.mjs

          python3 - << 'PYEOF'
          import json
          import os
          from pathlib import Path

          state_path = Path(".release_state.json")
          if state_path.exists():
              state = json.loads(state_path.read_text(encoding="utf-8"))
          else:
              state = {}
          timestamps = json.loads(os.environ.get("ASSET_TIMESTAMPS", "{}"))
          state["assets"] = {
              name: value for name, value in timestamps.items() if value
          }
          values = list(state["assets"].values())
          state["last_sync"] = max(values) if values else ""
          state_path.write_text(
              json.dumps(state, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PYEOF

      - name: 同步网页版本文案
        run: npm run sync:release-copy

      - name: 提交发布 manifest 与版本文案
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            public/release-manifest.json \
            public/release.json \
            public/old-versions.json \
            .release_state.json \
            index.html \
            download.html \
            src/data/siteContent.js \
            src/components/HeroSection.jsx
          if git diff --staged --quiet; then
            echo "No release metadata or website copy changes"
            exit 0
          fi
          git commit -m "chore: sync upstream release"
          for i in 1 2 3; do
            if git pull --rebase && git push; then
              echo "Push succeeded on attempt $i"
              exit 0
            fi
            echo "Push failed on attempt $i, retrying..."
            sleep 2
          done
          echo "Push failed after 3 attempts" >&2
          exit 1

  build-manual:
    needs: check
    if: needs.check.outputs.should_build_manual == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 触发用户手册构建
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_API: https://api.github.com/repos/${{ github.repository }}
        run: |
          curl -fsSL --retry 2 -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$REPO_API/actions/workflows/build-manual.yml/dispatches" \
            -d '{"ref":"master"}'
          echo "Triggered build-manual workflow"
