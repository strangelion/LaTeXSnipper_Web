name: 校验并同步 Release 文案

on:
  push:
    branches:
      - master
    paths:
      - public/release-manifest.json
      - scripts/apply-release-version.mjs
      - tests/site-content.test.mjs
      - .github/workflows/release_copy_guard.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latexsnipper-web-master-writer
  cancel-in-progress: false

jobs:
  sync-release-copy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci --ignore-scripts

      - name: 同步版本文案
        run: npm run sync:release-copy

      - name: 运行站点测试
        run: npm test

      - name: 提交同步结果
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            index.html \
            download.html \
            src/data/siteContent.js \
            src/components/HeroSection.jsx
          if git diff --staged --quiet; then
            echo "Release copy already matches the manifest"
            exit 0
          fi
          git commit -m "chore: sync release copy"
          for i in 1 2 3; do
            if git pull --rebase && git push; then
              echo "Push succeeded on attempt $i"
              exit 0
            fi
            echo "Push failed on attempt $i, retrying..."
            sleep 2
          done
          echo "Push failed after 3 attempts" >&2
          exit 1
