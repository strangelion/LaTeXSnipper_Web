name: Web

on:
  push:
    branches: [new, main, master]
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: ["同步 Release 到 R2"]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: latexsnipper-web-${{ github.event_name }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && 'master' || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare locked Core Release WASM
        run: npm run prepare:web

      - name: Test
        run: npm test

      - name: Validate release manifest
        run: npm run validate:release

      - name: Build
        run: npm run build

      - name: Verify deploy artifacts
        run: |
          test -f deploy/index.html
          test -f deploy/styles/liquid-glass.css
          test -f deploy/assets/brand/snipper-girl.webp
          test -f deploy/assets/brand/snipper-girl-640.webp
          test -f deploy/assets/brand/snipper-girl-960.webp
          test -f deploy/assets/images/icon-96.png
          test -f deploy/assets/demos/screenshot-recognition.webp
          test -f deploy/assets/demos/image-recognition.webp
          test -f deploy/assets/demos/pdf-recognition.webp
          test -f deploy/core-wasm/latexsnipper_wasm_bg.wasm
          test -f deploy/core-wasm/core-build.json
          test -f deploy/vendor/onnxruntime/ort.all.min.js
          test -f deploy/open-source.html

      - name: Validate Wrangler configuration
        run: npx wrangler deploy --dry-run

      - name: Validate Cloudflare deployment credentials
        if: github.event_name == 'workflow_run' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/master')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "Missing repository secret: CLOUDFLARE_API_TOKEN" >&2
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Missing repository secret: CLOUDFLARE_ACCOUNT_ID" >&2
            exit 1
          fi

      - name: Deploy production to Cloudflare
        if: github.event_name == 'workflow_run' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/master')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - uses: actions/upload-artifact@v6
        with:
          name: latexsnipper-web
          path: deploy
